<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Network connections (drawn first, behind nodes) -->
  <!-- Input layer to hidden layer connections -->
  <line x1="5" y1="12" x2="32" y2="16" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="5" y1="12" x2="32" y2="32" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="5" y1="12" x2="32" y2="48" stroke="#06b6d4" stroke-width="2.5"/>
  
  <line x1="5" y1="32" x2="32" y2="16" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="5" y1="32" x2="32" y2="32" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="5" y1="32" x2="32" y2="48" stroke="#a855f7" stroke-width="2.5"/>
  
  <line x1="5" y1="52" x2="32" y2="16" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="5" y1="52" x2="32" y2="32" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="5" y1="52" x2="32" y2="48" stroke="#06b6d4" stroke-width="2.5"/>
  
  <!-- Hidden layer to output layer connections -->
  <line x1="32" y1="16" x2="59" y2="22" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="32" y1="16" x2="59" y2="42" stroke="#06b6d4" stroke-width="2.5"/>
  
  <line x1="32" y1="32" x2="59" y2="22" stroke="#06b6d4" stroke-width="2.5"/>
  <line x1="32" y1="32" x2="59" y2="42" stroke="#a855f7" stroke-width="2.5"/>
  
  <line x1="32" y1="48" x2="59" y2="22" stroke="#a855f7" stroke-width="2.5"/>
  <line x1="32" y1="48" x2="59" y2="42" stroke="#06b6d4" stroke-width="2.5"/>
  
  <!-- Neural network nodes (drawn last, on top of strokes) -->
  <!-- Input layer -->
  <circle cx="5" cy="12" r="3" fill="#6366f1"/>
  <circle cx="5" cy="32" r="3" fill="#6366f1"/>
  <circle cx="5" cy="52" r="3" fill="#6366f1"/>
  
  <!-- Hidden layer -->
  <circle cx="32" cy="16" r="3" fill="#8b5cf6"/>
  <circle cx="32" cy="32" r="3" fill="#8b5cf6"/>
  <circle cx="32" cy="48" r="3" fill="#8b5cf6"/>
  
  <!-- Output layer -->
  <circle cx="59" cy="22" r="3" fill="#ec4899"/>
  <circle cx="59" cy="42" r="3" fill="#ec4899"/>
  
  <!-- MS Text centered vertically and horizontally -->
  <text x="32" y="32" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" alignment-baseline="central" fill="#fbbf24">MS</text>
</svg>